<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h1 class="title">Currency Converter</h1>
      <p class="subtitle">Convert currencies with live exchange rates in seconds.</p>
      <form class="converter-card">
        <div class="form-group">
          <label for="amount">Enter Amount</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-coins"></i>
            <input id="amount" value="1" type="text" inputmode="decimal" />
          </div>
        </div>
        <div class="dropdown">
          <div class="currency-column">
            <p class="label">From</p>
            <div class="select-container" data-role="from">
              <img src="https://flagsapi.com/US/flat/64.png" alt="From country flag" />
              <select name="from"></select>
            </div>
          </div>
          <button type="button" class="swap" aria-label="Swap currencies">
            <i class="fa-solid fa-right-left"></i>
          </button>
          <div class="currency-column">
            <p class="label">To</p>
            <div class="select-container" data-role="to">
              <img src="https://flagsapi.com/IN/flat/64.png" alt="To country flag" />
              <select name="to"></select>
            </div>
          </div>
        </div>
        <div class="msg">1 USD = 80 INR</div>
        <button class="primary-btn" type="submit">
          <span>Get Exchange Rate</span>
          <i class="fa-solid fa-arrow-trend-up"></i>
        </button>
      </form>
    </div>
    <script src="codes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
